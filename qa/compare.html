<!doctype html><html><head><meta charset="utf-8"><title>compare</title>
<style>
html,body{margin:0;background:#111;color:#ddd;font:600 22px/1 system-ui,sans-serif}
#g{display:grid;gap:8px;padding:8px}
.c{position:relative;background:#000}
.c img{display:block;width:100%;height:100%;object-fit:cover}
.c .l{position:absolute;left:10px;top:8px;padding:6px 12px;background:rgba(0,0,0,.65);border:1px solid #666;letter-spacing:.1em}
</style></head><body><div id="g"></div>
<script>
const q=new URLSearchParams(location.search);
const imgs=(q.get('imgs')||'').split(',').filter(Boolean);
const labels=(q.get('labels')||'').split(',');
const cols=+(q.get('cols')||2);
const g=document.getElementById('g');
g.style.gridTemplateColumns=`repeat(${cols},1fr)`;
const W=+(q.get('w')||1920), H=+(q.get('h')||1080);
g.style.width=W+'px';
let n=0;
imgs.forEach((src,i)=>{const d=document.createElement('div');d.className='c';d.style.height=(H/Math.ceil(imgs.length/cols)-8-8/cols)+'px';
const im=new Image();im.onload=im.onerror=()=>{if(++n===imgs.length)window.__done=true};im.src=src;d.appendChild(im);
if(labels[i]){const l=document.createElement('div');l.className='l';l.textContent=labels[i];d.appendChild(l);}g.appendChild(d);});
if(!imgs.length)window.__done=true;
</script></body></html>
