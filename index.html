<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZAVOD</title>
<link rel="icon" href="./favicon.svg">
<link rel="stylesheet" href="./src/hud.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/",
  "three-mesh-bvh": "./vendor/three-mesh-bvh/src/index.js"
} }
</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #app canvas{touch-action:none}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#05070a;z-index:50;transition:opacity .6s}
  #boot.hide{opacity:0;pointer-events:none}
  #boot .t{font:600 13px/1 ui-monospace,Menlo,monospace;letter-spacing:.35em;color:#8fa3b8}
  #boot .bar{width:260px;height:2px;background:#1a222c}
  #boot .bar i{display:block;height:100%;width:0;background:#e9a23b;transition:width .2s}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<div id="boot"><div class="t">ZAVOD — LOADING</div><div class="bar"><i id="bootbar"></i></div><div class="t" id="boottxt" style="letter-spacing:.1em;font-size:11px;color:#56687a"></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
