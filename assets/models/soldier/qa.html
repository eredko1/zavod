<!doctype html>
<html><head><meta charset="utf-8"><title>AI QA harness</title>
<script type="importmap">{ "imports": { "three": "../../../vendor/three/build/three.module.js", "three/addons/": "../../../vendor/three/examples/jsm/" } }</script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<script type="module">
// Standalone harness: stub world + player, real ai.js. Used only for AI-agent iteration.
import * as THREE from 'three';
import { createCtx } from '../../../src/ctx.js';
import * as ai from '../../../src/ai.js';
const ctx = createCtx(); window.__ctx = ctx;
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement); ctx.renderer = renderer; ctx.canvas = renderer.domElement;
const scene = new THREE.Scene(); ctx.scene = scene; scene.background = new THREE.Color(0x0b0f14); scene.fog = new THREE.FogExp2(0x0b0f14, 0.012);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.03, 600); camera.rotation.order = 'YXZ'; scene.add(camera); ctx.camera = camera;
const hemi = new THREE.HemisphereLight(0x8899aa, 0x333333, 1.6); scene.add(hemi);
const key = new THREE.DirectionalLight(0x8899bb, 1.6); key.position.set(20, 40, 10); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = key.shadow.camera.bottom = -40; key.shadow.camera.right = key.shadow.camera.top = 40; scene.add(key);
const spot = new THREE.SpotLight(0xffb060, 400, 60, 0.6, 0.5, 1.5); spot.position.set(6, 9, 18); spot.castShadow = true; scene.add(spot); spot.target.position.set(0, 0, 8); scene.add(spot.target);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x1a1c1e, roughness: 0.6, metalness: 0.1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor); ctx.raycastTargets.push(floor);
for (let i = 0; i < 12; i++) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(6, 2.6, 2.4), new THREE.MeshStandardMaterial({ color: 0x556677, roughness: 0.6, metalness: 0.4 }));
  b.position.set((ctx.rng() - 0.5) * 80, 1.3, (ctx.rng() - 0.5) * 80); b.castShadow = b.receiveShadow = true; scene.add(b);
  ctx.colliders.push(new THREE.Box3().setFromObject(b)); ctx.raycastTargets.push(b);
}
ctx.world = { poses: {}, playerSpawns: [new THREE.Vector3(0, 0, 20)], enemySpawns: [new THREE.Vector3(0, 0, -30), new THREE.Vector3(20, 0, -20), new THREE.Vector3(-20, 0, -20), new THREE.Vector3(30, 0, 10)], bounds: new THREE.Box3(new THREE.Vector3(-100, 0, -100), new THREE.Vector3(100, 20, 100)), groundHeight: () => 0 };
const p = { position: new THREE.Vector3(0, 0, 20), velocity: new THREE.Vector3(), yaw: 0, pitch: 0, height: 1.7, health: 100, maxHealth: 100, sprinting: false, crouching: false, speed: 0, moveState: 'idle', hits: 0 };
p.eye = () => new THREE.Vector3(p.position.x, p.position.y + p.height, p.position.z);
p.teleport = (x, y, z, yaw = 0, pitch = 0) => { p.position.set(x, y, z); p.yaw = yaw; p.pitch = pitch; };
p.damage = (a, from) => { p.hits++; p.health = Math.max(0, p.health - a); ctx.bus.emit('playerDamaged', { amount: a, from }); };
ctx.player = p;
ctx.setState = (s) => { ctx.state = s; ctx.bus.emit('state', { state: s }); };
ctx.log = []; for (const ev of ['shot', 'wave', 'enemyKilled', 'victory', 'playerDamaged']) ctx.bus.on(ev, d => { if (ev !== 'shot') ctx.log.push(ev + ' ' + JSON.stringify({ n: d?.n, headshot: d?.headshot, amount: d?.amount })); });
ctx.shots = 0; ctx.bus.on('shot', () => ctx.shots++);
window.__game = { ready: false, stats: () => ({ fps: +ctx.perf.fps.toFixed(1), frameMs: +ctx.perf.frameMs.toFixed(2), drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles, enemies: ctx.ai?.soldiers?.length, state: ctx.state }), teleport: (...a) => p.teleport(...a), timeScale: (s) => { ctx.time.scale = s; }, freezeAI: (v = true) => { ctx.ai.frozen = v; }, killAll: () => ctx.ai.qaKillAll() };
ctx.ai = await ai.init(ctx);
ctx.setState('playing');
const qs = ctx.qs; if (qs.get('pose')) { const a = qs.get('pose').split(',').map(Number); p.teleport(...a); }
let last = performance.now(); let acc = 0, n = 0;
function frame(now) {
  requestAnimationFrame(frame); let dt = Math.min(0.1, (now - last) / 1000); last = now; dt *= ctx.time.scale;
  ctx.time.dt = dt; ctx.time.elapsed += dt; ctx.time.frame++;
  const ta = performance.now(); try { ai.update(dt, ctx); } catch (e) { if (ctx.time.frame % 120 === 1) console.error('[update:ai]', e); } window.__aiMs = (window.__aiMs || 0) * 0.95 + (performance.now() - ta) * 0.05;
  camera.position.copy(p.eye()); camera.rotation.set(p.pitch, p.yaw, 0);
  const t0 = performance.now(); renderer.render(scene, camera);
  acc += dt / ctx.time.scale; n++; if (acc > 0.5) { ctx.perf.fps = n / acc; ctx.perf.frameMs = 1000 * acc / n; acc = 0; n = 0; }
}
window.__game.ready = true; requestAnimationFrame(frame);
</script></body></html>
